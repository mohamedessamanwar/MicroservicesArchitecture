services:
  # =========================
  # PostgreSQL (Primary DB)
  # =========================
  write-db:
    image: postgres:16-alpine # Primary DB container
    container_name: write-db # Friendly container name
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    env_file:
      - .env/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist database data
      - ./infra/postgres/write-startup.sh:/usr/local/bin/write-startup.sh:ro
      - ./OrderService_Migration.sql:/scripts/order-migration.sql:ro
      - ./PaymentService_Migration.sql:/scripts/payment-migration.sql:ro
    entrypoint: [ "sh", "/usr/local/bin/write-startup.sh" ]
    networks:
      - microservices-network # Shared network for all services
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d write_db" ] # Wait until Postgres accepts connections
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # =========================
  # PostgreSQL (Read Replica)
  # =========================
  read-db:
    image: postgres:16-alpine # Replica DB container
    container_name: read-db # Friendly container name
    command:
      - postgres
    env_file:
      - .env/postgres.env
    volumes:
      - read_db_data:/var/lib/postgresql/data # Persist replica data
      - ./infra/postgres/read-startup.sh:/usr/local/bin/read-startup.sh:ro
    entrypoint: [ "sh", "/usr/local/bin/read-startup.sh" ]
    depends_on:
      write-db:
        condition: service_healthy
    networks:
      - microservices-network # Shared network for all services
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d write_db && psql -U ${POSTGRES_USER:-admin} -d postgres -tAc 'select pg_is_in_recovery()' | grep -q t" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # =========================
  # PgBouncer
  # =========================
  pgbouncer:
    build:
      context: ./infra/pgbouncer
      dockerfile: Dockerfile
    container_name: pgbouncer
    restart: unless-stopped # Keep PgBouncer running
    user: postgres # PgBouncer refuses to run as root, so we run as postgres user
    depends_on:
      write-db:
        condition: service_healthy
      read-db:
        condition: service_healthy
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro # Map config directly to avoid rebuilds
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - microservices-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U admin -d OrderDb" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7-alpine # Redis base image
    container_name: redis # Friendly container name
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data # Persist Redis data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - microservices-network # Shared network for all services
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ] # Validate Redis health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # =========================
  # RabbitMQ + Management UI
  # =========================
  rabbitmq:
    image: rabbitmq:3-management-alpine # RabbitMQ with management UI
    container_name: rabbitmq # Friendly container name
    env_file:
      - .env/rabbitmq.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # Persist RabbitMQ data
    networks:
      - microservices-network # Shared network for all services
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ] # Wait for RabbitMQ to be ready
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # =========================
  # RabbitMQ Topology Init
  # =========================
  rabbitmq-init:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-init
    env_file:
      - .env/rabbitmq.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./infra/rabbitmq/init-topology.sh:/usr/local/bin/init-topology.sh:ro
    entrypoint: [ "sh", "/usr/local/bin/init-topology.sh" ]
    networks:
      - microservices-network
    restart: "no"

  # =========================
  # Order Service API
  # =========================
  order-service:
    build:
      context: . # Solution root
      dockerfile: OrderService.Api/Dockerfile # Order API Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: order-service # Friendly container name
    env_file:
      - .env/order-service.env
    depends_on:
      pgbouncer:
        condition: service_healthy # Wait for PgBouncer
      rabbitmq-init:
        condition: service_completed_successfully # Wait for RabbitMQ topology
      redis:
        condition: service_healthy # Wait for Redis
    networks:
      - microservices-network # Shared network for all services
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================
  # Payment Service API
  # =========================
  payment-service:
    build:
      context: . # Solution root
      dockerfile: Payment.Api/Dockerfile # Payment API Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: payment-service # Friendly container name
    env_file:
      - .env/payment-service.env
    depends_on:
      pgbouncer:
        condition: service_healthy # Wait for PgBouncer
      rabbitmq-init:
        condition: service_completed_successfully # Wait for RabbitMQ topology
      redis:
        condition: service_healthy # Wait for Redis
    networks:
      - microservices-network # Shared network for all services
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================
  # API Gateway
  # =========================
  api-gateway:
    build:
      context: . # Solution root
      dockerfile: ApiGateway/Dockerfile # API Gateway Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: api-gateway # Friendly container name
    depends_on:
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - microservices-network # Shared network for all services
    ports:
      - "80:8080"
      - "5000:8080"
      - "443:8081"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data: # Write DB volume
  read_db_data: # Replica DB volume
  redis_data: # Redis volume
  rabbitmq_data: # RabbitMQ volume

networks:
  microservices-network:
    driver: bridge # Shared bridge network
