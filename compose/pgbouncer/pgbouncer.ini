[databases]
OrderDb = host=write-db port=5432 dbname=OrderDb
OrderDbReplica = host=read-db port=5432 dbname=OrderDb
OrderDbUae = host=write-db port=5432 dbname=OrderDb
OrderDbUaeReplica = host=read-db port=5432 dbname=OrderDb
PaymentDb = host=write-db port=5432 dbname=PaymentDb
PaymentDbReplica = host=read-db port=5432 dbname=PaymentDb
PaymentDbUae = host=write-db port=5432 dbname=PaymentDb
PaymentDbUaeReplica = host=read-db port=5432 dbname=PaymentDb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
server_reset_query = DISCARD ALL
server_idle_timeout = 60
ignore_startup_parameters = extra_float_digits
admin_users = admin
stats_users = admin
log_connections = 1
log_disconnections = 1