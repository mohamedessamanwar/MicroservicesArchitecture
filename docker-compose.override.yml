services:
  # =========================
  # Order Service (local debug)
  # =========================
  order-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development # Use Development settings
      ASPNETCORE_URLS: http://+:8080 # Bind HTTP inside container
      ASPNETCORE_HTTP_PORTS: 8080 # HTTP port inside container
      DOTNET_USE_POLLING_FILE_WATCHER: "1" # Better file watching in containers
      VSDBG_PMI_ENABLE: "1" # Enable VS debugger process monitoring

  # =========================
  # Payment Service (local debug)
  # =========================
  payment-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development # Use Development settings
      ASPNETCORE_URLS: http://+:8080 # Bind HTTP inside container
      ASPNETCORE_HTTP_PORTS: 8080 # HTTP port inside container
      DOTNET_USE_POLLING_FILE_WATCHER: "1" # Better file watching in containers
      VSDBG_PMI_ENABLE: "1" # Enable VS debugger process monitoring

  # =========================
  # Product Service (local debug)
  # =========================
  product-service:
    environment:
      ASPNETCORE_ENVIRONMENT: Development # Use Development settings
      ASPNETCORE_URLS: http://+:8080 # Bind HTTP inside container
      ASPNETCORE_HTTP_PORTS: 8080 # HTTP port inside container
      DOTNET_USE_POLLING_FILE_WATCHER: "1" # Better file watching in containers
      VSDBG_PMI_ENABLE: "1" # Enable VS debugger process monitoring

  # =========================
  # API Gateway (local debug)
  # =========================
  api-gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Development # Use Development settings
      ASPNETCORE_URLS: http://+:8080 # Bind HTTP inside container
      ASPNETCORE_HTTP_PORTS: 8080 # HTTP port inside container
      DOTNET_USE_POLLING_FILE_WATCHER: "1" # Better file watching in containers
      VSDBG_PMI_ENABLE: "1" # Enable VS debugger process monitoring

  # =========================
  # PgBouncer (local IDE access)
  # =========================
  pgbouncer:
    ports:
      - "6432:6432"

  # =========================
  # PostgreSQL Primary (local IDE access)
  # =========================
  write-db:
    ports:
      - "5432:5432"

  # =========================
  # PostgreSQL Standby Replica (local IDE access)
  # =========================
  read-db:
    ports:
      - "5433:5432"

  # =========================
  # Redis (local IDE access)
  # =========================
  redis:
    ports:
      - "6380:6379"

  # =========================
  # RabbitMQ (local IDE access + UI)
  # =========================
  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"


