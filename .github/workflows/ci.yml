name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore MicroservicesArchitecture.sln

    - name: Build
      run: dotnet build MicroservicesArchitecture.sln --configuration Release --no-restore

    - name: Login to Docker Hub
      if: success()
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Images
      if: success()
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/order-service:latest -t ${{ secrets.DOCKER_USERNAME }}/order-service:v${{ github.run_number }} -f OrderService.Api/Dockerfile .
        docker build -t ${{ secrets.DOCKER_USERNAME }}/payment-service:latest -t ${{ secrets.DOCKER_USERNAME }}/payment-service:v${{ github.run_number }} -f Payment.Api/Dockerfile .
        docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:v${{ github.run_number }} -f ApiGateway/Dockerfile .
        docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service:latest -t ${{ secrets.DOCKER_USERNAME }}/product-service:v${{ github.run_number }} -f ProductService.Api/Dockerfile .

    - name: Push Docker Images
      if: success()
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/order-service:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/order-service:v${{ github.run_number }}
        docker push ${{ secrets.DOCKER_USERNAME }}/payment-service:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/payment-service:v${{ github.run_number }}
        docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:v${{ github.run_number }}
        docker push ${{ secrets.DOCKER_USERNAME }}/product-service:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/product-service:v${{ github.run_number }}

    - name: Send Email Notification
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "CI/CD Pipeline - ${{ github.repository }}: ${{ job.status }}"
        to: ${{ secrets.TO_EMAIL }}
        from: CI/CD Pipeline
        html_body: |
          <h2>Build Workflow Result</h2>
          <p>The workflow on repository <b>${{ github.repository }}</b> for branch <b>${{ github.ref_name }}</b> finished with status: <b>${{ job.status }}</b>.</p>
          <p>Please check your GitHub Actions tab for more details.</p>
