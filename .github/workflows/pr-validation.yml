name: PR Validation Pipeline

# Trigger this workflow when a Pull Request is opened or updated targeting 'master'.
# This validates the effective merge result (the branch + master) to ensure safety.
on:
  pull_request:
    branches:
      - master

# Concurrency: If a developer pushes a new commit to the same PR, 
# cancel the currently running workflow to save resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use least-privilege permissions.
permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: Build & Formatting Check
  # This job ensures the solution compiles and adheres to format rules.
  # ==========================================
  build-and-lint:
    name: Build & Lint
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          # Caching NuGet packages speeds up the restore process.
          cache: true

      - name: Restore Dependencies
        run: dotnet restore MicroservicesArchitecture.sln

      - name: Verify Code Formatting
        # Checks if code formatting conforms to .NET conventions. Fails if changes are needed.
        run: dotnet format MicroservicesArchitecture.sln --verify-no-changes --no-restore

      - name: Build Complete Solution
        # Build the entire solution to guarantee no compilation errors.
        run: dotnet build MicroservicesArchitecture.sln --configuration Release --no-restore

  # ==========================================
  # JOB 2: Tests
  # This job runs all tests. Runs in PARALLEL with Security Scan but depends on Build.
  # ==========================================
  test:
    name: Run Tests
    runs-on: self-hosted
    needs: build-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true

      - name: Run Tests
        # Placeholder for automated tests. Will warn if no tests exist but won't fail yet.
        run: dotnet test MicroservicesArchitecture.sln --configuration Release --no-build --verbosity normal || echo "No test projects found."

  # ==========================================
  # JOB 3: Security Scan (CodeQL)
  # This job runs in PARALLEL with the Build & Test jobs.
  # It statically analyzes the C# code for security vulnerabilities.
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: self-hosted
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Setup .NET for CodeQL
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build for CodeQL
        run: dotnet build MicroservicesArchitecture.sln --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
